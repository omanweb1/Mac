<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAC Restaurant | قائمة الطعام</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0612;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-accent: #6C5CE7;
            --secondary-accent: #FF7675;
            --text-white: #ffffff;
            --text-muted: #a0a0a0;
            --gradient-accent: linear-gradient(135deg, #6C5CE7, #a367dc);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Poppins', sans-serif;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            overflow-x: hidden;
            min-height: 100vh;
        }

        header {
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 6, 18, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-logo {
            font-size: 28px;
            font-weight: 800;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-white);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-btn:hover {
            border-color: var(--primary-accent);
            color: var(--primary-accent);
        }

        .cart-icon-wrapper {
            position: relative;
            background: rgba(255,255,255,0.05);
            padding: 10px 14px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        .cart-icon-wrapper:hover {
            border-color: var(--primary-accent);
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--secondary-accent);
            color: white;
            font-size: 11px;
            font-weight: bold;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        html[dir="ltr"] .cart-badge {
            right: auto;
            left: -5px;
        }

        .hero-section {
            text-align: center;
            padding: 60px 20px 30px;
        }

        .hero-title {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .hero-slogan {
            font-size: 18px;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .menu-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .food-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .food-card:hover {
            border-color: var(--primary-accent);
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }

        .food-img-wrapper {
            width: 100%;
            height: 200px;
            overflow: hidden;
            position: relative;
        }

        .food-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .food-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .food-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .food-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .food-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .food-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-accent);
        }

        .add-to-cart-btn {
            background: var(--gradient-accent);
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-to-cart-btn:hover {
            opacity: 0.9;
        }

        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100%;
            background: #120a1f;
            border-left: 1px solid var(--border-color);
            z-index: 2000;
            transition: right 0.4s ease;
            display: flex;
            flex-direction: column;
            padding: 25px;
        }

        html[dir="ltr"] .cart-sidebar {
            right: auto;
            left: -400px;
            border-left: none;
            border-right: 1px solid var(--border-color);
            transition: left 0.4s ease;
        }

        .cart-sidebar.open {
            right: 0;
        }

        html[dir="ltr"] .cart-sidebar.open {
            left: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .close-cart-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            margin: 20px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.02);
            padding: 12px;
            border-radius: 10px;
        }

        .cart-item-info h4 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .cart-item-info p {
            font-size: 13px;
            color: var(--primary-accent);
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            background: var(--border-color);
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
        }

        .cart-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .whatsapp-send-btn {
            width: 100%;
            background: #25D366;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .whatsapp-send-btn:hover {
            background: #1ebc57;
        }

        @media (max-width: 480px) {
            .cart-sidebar {
                width: 100%;
                right: -100%;
            }
            html[dir="ltr"] .cart-sidebar {
                left: -100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">MAC</div>
        <div class="header-actions">
            <button class="lang-btn" onclick="toggleLanguage()">
                <i class="fa-solid fa-globe"></i>
                <span id="lang-btn-text">English</span>
            </button>

            <div class="cart-icon-wrapper" onclick="toggleCart()">
                <i class="fa-solid fa-cart-shopping"></i>
                <div class="cart-badge" id="cart-badge-count">0</div>
            </div>
        </div>
    </header>

    <section class="hero-section">
        <h1 class="hero-title">MAC Restaurant</h1>
        <p class="hero-slogan" id="hero-slogan-text">
            طعم الجودة واللذة، يُحضَّر بكل شغف ليكون خيارك المفضل دائماً.
        </p>
    </section>

    <main class="menu-container" id="menu-container"></main>

    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3 id="cart-title">سلة المشتريات</h3>
            <button class="close-cart-btn" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-items" id="cart-items-container"></div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span id="cart-total-label">المجموع:</span>
                <span id="cart-total-price">0.000 ر.ع</span>
            </div>
            <button class="whatsapp-send-btn" onclick="sendToWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i>
                <span id="whatsapp-btn-text">إرسال الطلب عبر الواتساب</span>
            </button>
        </div>
    </div>

    <script>
        const restaurantWhatsAppNumber = "96890000000"; // استبدله برقمك

        const translations = {
            ar: {
                langButton: "English",
                heroSlogan: "طعم الجودة واللذة، يُحضَّر بكل شغف ليكون خيارك المفضل دائماً.",
                cartTitle: "سلة المشتريات",
                cartTotalLabel: "المجموع الإجمالي:",
                whatsappBtn: "إرسال الطلب عبر الواتساب",
                addToCartBtn: "إضافة",
                currency: "ر.ع",
                emptyCartMsg: "سلة المشتريات فارغة حالياً."
            },
            en: {
                langButton: "العربية",
                heroSlogan: "The taste of quality and deliciousness, crafted with passion to be your ultimate favorite choice.",
                cartTitle: "Shopping Cart",
                cartTotalLabel: "Total Amount:",
                whatsappBtn: "Send Order via WhatsApp",
                addToCartBtn: "Add",
                currency: "OMR",
                emptyCartMsg: "Your cart is currently empty."
            }
        };

        const foodData = [
            {
                id: 1,
                nameAr: "ماك سينجل برجر",
                nameEn: "MAC Single Burger",
                descAr: "شريحة لحم بقر طازجة مع جبنة شيدر مضافة وصوص ماك الخاص.",
                descEn: "Fresh beef patty with cheddar cheese and special MAC sauce.",
                price: 2.200,
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500"
            },
            {
                id: 2,
                nameAr: "ماك دبل تشيز",
                nameEn: "MAC Double Cheese",
                descAr: "شريحتان من اللحم المشوي مع طبقتين من الجبنة الذائبة.",
                descEn: "Double grilled beef patties with double melted cheese.",
                price: 3.100,
                image: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=500"
            },
            {
                id: 3,
                nameAr: "كريسبي تشيكن برجر",
                nameEn: "Crispy Chicken Burger",
                descAr: "صدر دجاج مقرمش مع الخس الصازج وصوص المايونيز الحار.",
                descEn: "Crispy chicken breast with fresh lettuce and spicy mayo.",
                price: 2.500,
                image: "https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?w=500"
            },
            {
                id: 4,
                nameAr: "بطاطس ماك المتبلة",
                nameEn: "MAC Seasoned Fries",
                descAr: "بطاطس مقرمشة متبلة بخلطة بهارات ماك الخاصة.",
                descEn: "Crispy fries seasoned with signature MAC spice mix.",
                price: 1.000,
                image: "https://images.unsplash.com/photo-1576107232684-1279f390859f?w=500"
            }
        ];

        let currentLang = "ar";
        let cart = [];

        function renderMenu() {
            const menuContainer = document.getElementById("menu-container");
            menuContainer.innerHTML = "";

            foodData.forEach(item => {
                const name = currentLang === "ar" ? item.nameAr : item.nameEn;
                const desc = currentLang === "ar" ? item.descAr : item.descEn;
                const currency = translations[currentLang].currency;

                const cardHtml = `
                    <div class="food-card">
                        <div class="food-img-wrapper">
                            <img src="${item.image}" alt="${name}" class="food-img">
                        </div>
                        <div class="food-info">
                            <div>
                                <h3 class="food-title">${name}</h3>
                                <p class="food-desc">${desc}</p>
                            </div>
                            <div class="food-bottom">
                                <span class="food-price">${item.price.toFixed(3)} ${currency}</span>
                                <button class="add-to-cart-btn" onclick="addToCart(${item.id})">
                                    <i class="fa-solid fa-plus"></i> ${translations[currentLang].addToCartBtn}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                menuContainer.innerHTML += cardHtml;
            });
        }

        function toggleLanguage() {
            currentLang = currentLang === "ar" ? "en" : "ar";
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";

            document.getElementById("lang-btn-text").innerText = translations[currentLang].langButton;
            document.getElementById("hero-slogan-text").innerText = translations[currentLang].heroSlogan;
            document.getElementById("cart-title").innerText = translations[currentLang].cartTitle;
            document.getElementById("cart-total-label").innerText = translations[currentLang].cartTotalLabel;
            document.getElementById("whatsapp-btn-text").innerText = translations[currentLang].whatsappBtn;

            renderMenu();
            updateCart();
        }

        function toggleCart() {
            const sidebar = document.getElementById("cart-sidebar");
            sidebar.classList.toggle("open");
        }

        function addToCart(itemId) {
            const existingItem = cart.find(item => item.id === itemId);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                const itemData = foodData.find(item => item.id === itemId);
                cart.push({ ...itemData, quantity: 1 });
            }
            updateCart();
        }

        function changeQuantity(itemId, change) {
            const itemIndex = cart.findIndex(item => item.id === itemId);
            if (itemIndex > -1) {
                cart[itemIndex].quantity += change;
                if (cart[itemIndex].quantity <= 0) {
                    cart.splice(itemIndex, 1);
                }
            }
            updateCart();
        }

        function updateCart() {
            const container = document.getElementById("cart-items-container");
            const badge = document.getElementById("cart-badge-count");
            const totalPriceElement = document.getElementById("cart-total-price");

            container.innerHTML = "";
            let totalItemsCount = 0;
            let totalPrice = 0;

            if (cart.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; margin-top: 40px;">${translations[currentLang].emptyCartMsg}</p>`;
            } else {
                cart.forEach(item => {
                    totalItemsCount += item.quantity;
                    const itemTotal = item.price * item.quantity;
                    totalPrice += itemTotal;

                    const name = currentLang === "ar" ? item.nameAr : item.nameEn;
                    const currency = translations[currentLang].currency;

                    const itemHtml = `
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <h4>${name}</h4>
                                <p>${itemTotal.toFixed(3)} ${currency}</p>
                            </div>
                            <div class="cart-controls">
                                <button class="qty-btn" onclick="changeQuantity(${item.id}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button class="qty-btn" onclick="changeQuantity(${item.id}, 1)">+</button>
                            </div>
                        </div>
                    `;
                    container.innerHTML += itemHtml;
                });
            }

            badge.innerText = totalItemsCount;
            totalPriceElement.innerText = `${totalPrice.toFixed(3)} ${translations[currentLang].currency}`;
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                alert(currentLang === "ar" ? "سلة المشتريات فارغة حالياً!" : "Your cart is empty!");
                return;
            }

            let billText = `🍔 *طلب جديد من مطعم MAC* 🍔\n\n`;
            let total = 0;

            cart.forEach((item, index) => {
                const name = currentLang === "ar" ? item.nameAr : item.nameEn;
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                billText += `${index + 1}. *${name}*\n   الكمية: ${item.quantity} | السعر: ${itemTotal.toFixed(3)} ر.ع\n\n`;
            });

            billText += `---------------------------\n`;
            billText += `💰 *المجموع الإجمالي للطلب: ${total.toFixed(3)} ر.ع*\n\n`;
            billText += `🚗 *طريقة الاستلام:* استلام ذاتي من فرع المطعم (لا يوجد توصيل).\n\n💬 سيتواصل معك المطعم لتحديد طريقة الدفع وتجهيز طلبك.`;

            const encodedText = encodeURIComponent(billText);
            const whatsappUrl = `https://api.whatsapp.com/send?phone=${restaurantWhatsAppNumber}&text=${encodedText}`;
            window.open(whatsappUrl, '_blank');
        }

        renderMenu();
    </script>
</body>
</html>
